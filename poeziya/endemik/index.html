<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЭНДЕМИК — Кошка Шрёдингера</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .endemik-content {
      padding-top: 24px;
    }

    .endemik-wrap {
      max-width: 1040px;
    }

    .endemik-figure {
      margin: 0;
    }

    .endemik-image {
      width: 100%;
      max-width: min(100%, 980px);
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    @media (max-width: 860px) {
      .endemik-content {
        padding-top: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div style="font-size: 28px; font-weight: bold;">Кошка Шрёдингера</div>
      <nav style="margin-top: 10px;">
        <a href="/">Главная</a>
        <a href="/articles/">Статьи</a>
        <a href="/kniga/">Книга</a>
        <a href="/proza/">Проза</a>
        <a href="/poeziya/">Поэзия</a>
        <a href="/about/">О проекте</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap endemik-wrap">
        <h1>ЭНДЕМИК</h1>
      </div>
    </section>

    <section class="content endemik-content">
      <div class="wrap endemik-wrap">
        <figure class="endemik-figure">
          <img
            class="page-image endemik-image"
            src="/assets/images/endemik.png"
            alt="Черно-белый постер к стихотворению ЭНДЕМИК"
          />
        </figure>

        <a class="back" href="/poeziya/">← Назад к поэзии</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      Кошка Шрёдингера
    </div>
  </footer>
</body>
</html>
