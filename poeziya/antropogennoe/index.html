<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>АНТРОПОГЕННОЕ — Кошка Шрёдингера</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .antropogennoe-content {
      padding-top: 24px;
    }

    .antropogennoe-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 460px);
      gap: 36px;
      align-items: start;
    }

    .antropogennoe-figure {
      margin: 0;
      margin-top: 82px;
      display: flex;
      justify-content: center;
    }

    .antropogennoe-image {
      width: 100%;
      max-width: 460px;
      max-height: 640px;
      height: auto;
      object-fit: contain;
      margin: 0;
    }

    @media (max-width: 780px) {
      .antropogennoe-layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .antropogennoe-figure {
        margin-top: 0;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div style="font-size: 28px; font-weight: bold;">Кошка Шрёдингера</div>
      <nav style="margin-top: 10px;">
        <a href="/">Главная</a>
        <a href="/articles/">Статьи</a>
        <a href="/kniga/">Книга</a>
        <a href="/proza/">Проза</a>
        <a href="/poeziya/">Поэзия</a>
        <a href="/about/">О проекте</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1>АНТРОПОГЕННОЕ</h1>
      </div>
    </section>

    <section class="content antropogennoe-content">
      <div class="wrap">
        <div class="antropogennoe-layout">
          <div class="poem antropogennoe-poem">АНТРОПОГЕННОЕ

даже  крик -  мощный триггер 
смертоносных  сошедших лавин,
тектонических  сдвигов  
cтал причиной безумец один.</div>

          <figure class="antropogennoe-figure">
            <img
              class="page-image antropogennoe-image"
              src="/assets/images/antropogennoe.png"
              alt="Черно-белый рисунок к стихотворению АНТРОПОГЕННОЕ"
            />
          </figure>
        </div>

        <a class="back" href="/poeziya/">← Назад к поэзии</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      Кошка Шрёдингера
    </div>
  </footer>
</body>
</html>
